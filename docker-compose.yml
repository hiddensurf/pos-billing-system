services:
  db:
    image: postgres:17
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: pos-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://pos_user:pos_password@db:5432/pos_db
      SECRET_KEY: development-secret-key
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data: